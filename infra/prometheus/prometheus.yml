global:
  scrape_interval: 5s

scrape_configs:
  # La API de Spring (métricas propias: gobernador, AIMD, breaker, colas, ítems, peticiones).
  # «api» resuelve al servicio del Compose completo, o al host con extra_hosts cuando la app corre fuera de Docker.
  - job_name: rama-queue
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:8087']

  # Plugin rabbitmq_prometheus (puerto 15692).
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
