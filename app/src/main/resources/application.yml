server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: rama-queue
  # Por defecto una sola JVM hace todos los roles. En Docker Compose cada servicio activa solo el suyo.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:api,worker-search,worker-detail}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5437}/ramaqueue
    username: ramaqueue
    password: ramaqueue
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ramaqueue
    password: ramaqueue
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

rama:
  base-url: ${RAMA_BASE_URL:http://localhost:8089/api/v2}
  # API de gestión de RabbitMQ (colas del dashboard, reconciliación y métricas): mismo host que AMQP.
  broker-api:
    url: http://${RABBITMQ_HOST:localhost}:15672

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
