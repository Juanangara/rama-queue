# Sirve la SPA y hace de proxy hacia la API y el mock. Los nombres se resuelven en cada petición (resolver de Docker)
# para que nginx arranque aunque la API todavía no esté lista.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $api http://api:8087;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # SSE: sin buffer y con una lectura larga, o los eventos llegan a rachas o se cortan.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Mandos del mock de la Rama: /mock/__admin/... → /__admin/...
    location /mock/ {
        set $mock http://mock-rama:8089;
        rewrite ^/mock/(.*)$ /$1 break;
        proxy_pass $mock;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri /index.html;
    }
}
